services:
  db:
    image: postgres:16-alpine
    container_name: param-db
    environment:
      POSTGRES_USER: ${PGUSER:-pentest}
      POSTGRES_PASSWORD: ${PGPASSWORD:-pentest}
      POSTGRES_DB: ${PGDATABASE:-pentest}
    ports:
      - "${PGPORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-pentest} -d ${PGDATABASE:-pentest}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
